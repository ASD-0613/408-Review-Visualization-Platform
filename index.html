<!-- Tailwind CSS（Play CDN：优先联网取最新；取不到就用仓库内兜底，见下面那段与 §6.2.34⑨） -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Tailwind 兜底（窗34）：本机浏览器加载 cdn.tailwindcss.com 会报 ERR_CERT_COMMON_NAME_INVALID
     （证书被网络中间层替换、Chrome/Edge 拒收，而 PowerShell 能下到 ⟹ 不是"没网"）。
     这里在解析期同步补一份**仓库内的同一版 Play CDN 3.4.16**（js/vendor/，MIT），
     于是"双击 index.html"在任何网络下都有样式；CDN 正常时这一段零开销（window.tailwind 已存在就不加载）。
     ⚠ 头尾两行注释是 harness 的摘除锚点（tests 里按它整段删掉，保证离线页面仍是"无 Tailwind"的基线）。 -->
<script>
  if (!window.tailwind) document.write('<script src="js/vendor/tailwind-play-3.4.16.js?v=98"><\/script>');
</script>
<!-- Tailwind 兜底结束 -->
<script>

    theme: {
      extend: {
        fontFamily: {

          mono: ['Consolas', '"JetBrains Mono"', 'ui-monospace', 'monospace'],

    },

</script>
